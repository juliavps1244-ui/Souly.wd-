<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste Souly Login</title><script src="config.js?v=6"></script><style>body{font-family:system-ui;background:#f6f0e8;color:#1a1020;display:grid;place-items:center;min-height:100vh;margin:0}.card{width:min(520px,90vw);background:white;padding:24px;border-radius:20px;box-shadow:0 20px 50px #0001}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid #ddd;margin-top:10px}button{background:#2b123b;color:white;font-weight:700}.msg{white-space:pre-wrap;margin-top:16px;padding:12px;border-radius:12px;background:#f4eef7}</style></head><body><div class="card"><h1>Teste de login Souly</h1><p>Digite a senha do usuário Lya owner. Esta página testa apenas o Auth do Appwrite, sem banco.</p><input id="pw" type="password" placeholder="Senha"><button onclick="testar()">Testar login</button><div class="msg" id="msg">Aguardando teste...</div></div><script>const cfg=window.SOULY_CONFIG||{};const client=new Appwrite.Client().setEndpoint(cfg.APPWRITE_ENDPOINT).setProject(cfg.APPWRITE_PROJECT_ID);const account=new Appwrite.Account(client);async function testar(){const m=document.getElementById('msg');m.textContent='Testando...';try{try{await account.deleteSession({sessionId:'current'})}catch(e){}const senha=document.getElementById('pw').value;const s=await account.createEmailPasswordSession({email:cfg.ADMIN_EMAIL,password:senha});const u=await account.get();m.textContent='LOGIN OK ✅\nUsuário: '+(u.name||'')+'\nE-mail: '+u.email+'\nSession ID: '+s.$id;}catch(e){m.textContent='ERRO ❌\ncode: '+(e.code??'')+'\ntype: '+(e.type??'')+'\nmessage: '+(e.message??String(e));console.error(e);}}</script></body></html>
