<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste Souly Banco</title><script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0"></script><script src="config.js?v=3"></script><style>body{font-family:system-ui;background:#f6f0e8;color:#1a1020;display:grid;place-items:center;min-height:100vh;margin:0}.card{width:min(620px,90vw);background:white;padding:24px;border-radius:20px;box-shadow:0 20px 50px #0001}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid #ddd;margin-top:10px}button{background:#2b123b;color:white;font-weight:700}.msg{white-space:pre-wrap;margin-top:16px;padding:12px;border-radius:12px;background:#f4eef7;overflow-wrap:anywhere}</style></head><body><div class="card"><h1>Teste do banco Souly</h1><p>Digite a mesma senha que funcionou no teste de login. Aqui vamos descobrir exatamente onde o painel principal está travando.</p><input id="pw" type="password" placeholder="Senha"><button onclick="testar()">Testar login + banco</button><div class="msg" id="msg">Aguardando teste...</div></div><script>const cfg=window.SOULY_CONFIG||{};const client=new Appwrite.Client().setEndpoint(cfg.APPWRITE_ENDPOINT).setProject(cfg.APPWRITE_PROJECT_ID);const account=new Appwrite.Account(client);async function testar(){const m=document.getElementById('msg');m.textContent='1/3 Testando login...';try{try{await account.deleteSession('current')}catch(e){}await account.createEmailPasswordSession(cfg.ADMIN_EMAIL,document.getElementById('pw').value);const u=await account.get();m.textContent='LOGIN OK ✅\n2/3 Verificando TablesDB...';if(!Appwrite.TablesDB)throw new Error('Appwrite.TablesDB não existe nesta versão do SDK.');const db=new Appwrite.TablesDB(client);try{const row=await db.getRow({databaseId:cfg.APPWRITE_DATABASE_ID,tableId:cfg.APPWRITE_TABLE_ID,rowId:'souly-main'});m.textContent='LOGIN OK ✅\nBANCO OK ✅\nLinha souly-main encontrada.\nUsuário: '+u.email;}catch(e){if(Number(e.code)===404||String(e.type||'').includes('not_found')){m.textContent='LOGIN OK ✅\nBANCO ACESSÍVEL ✅\nA linha souly-main ainda não existe (isso é normal no primeiro uso).\nAgora falta testar a criação.';try{await db.createRow({databaseId:cfg.APPWRITE_DATABASE_ID,tableId:cfg.APPWRITE_TABLE_ID,rowId:'souly-main',data:{data:'{}'}});m.textContent+='\nCRIAÇÃO OK ✅';}catch(c){m.textContent+='\nCRIAÇÃO ERRO ❌\ncode: '+(c.code??'')+'\ntype: '+(c.type??'')+'\nmessage: '+(c.message??String(c));}}else{throw e;}}}catch(e){m.textContent+='\n\nERRO ❌\ncode: '+(e.code??'')+'\ntype: '+(e.type??'')+'\nmessage: '+(e.message??String(e));console.error(e);}}</script></body></html>
